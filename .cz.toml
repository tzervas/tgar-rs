[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version = "0.1.0-dev"

# 0.x IS THE POLICY, NOT AN ACCIDENT.
#
# `major_version_zero = true` makes commitizen keep the major at 0 whatever the
# commit history says — a `feat!:` or a `BREAKING CHANGE:` footer bumps MINOR,
# not MAJOR. Without it the first breaking commit silently ships 1.0.0, and
# 1.0.0 is a promise about API stability nobody in this fleet has made.
#
# Measured, not assumed. Against a scratch repo carrying a real `feat!:` +
# `BREAKING CHANGE:` commit:
#     major_version_zero = true   ->  0.2.0 -> 0.3.0
#     major_version_zero = false  ->  0.2.0 -> 1.0.0
#
# This matters more here than anywhere else in the fleet: tgar-rs is a port whose
# Python original (tg-agent-relay) is still the source of truth until a phase is
# explicitly dual-run green. A 1.0.0 here would claim a stability this crate does
# not yet have by its own rules.
#
# Cutting 1.x is a human decision: apply `human-authorized-1x` to the release PR
# and flip this flag to false in that same diff, so the version jump and the
# authorization are never separated.
major_version_zero = true

# The changelog is written, not generated. `cz changelog` is the source for an
# entry; a human edits it in.
update_changelog_on_bump = false

# Single source today — the workspace version, inherited by every crate via
# `version.workspace = true`. Add a row here if a second place ever states it.
version_files = [
    "Cargo.toml:^version",
]
